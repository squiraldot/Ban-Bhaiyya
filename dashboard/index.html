<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghostea Admin 👻</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0b0d10;color:#eee}
main{max-width:1000px;margin:auto;padding:24px}
.card{background:#151922;border:1px solid #2a3040;border-radius:16px;padding:18px;margin:12px 0}
input,button{padding:10px;border-radius:10px;border:1px solid #394154;background:#0d1118;color:#fff}
button{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{font-size:28px;font-weight:700}
small{color:#9ca3af}
</style>
</head>
<body>
<main>
<h1>Ghostea 👻 Admin</h1>
<div class="card">
  <input id="api" placeholder="https://ghostea.onrender.com" size="35">
  <input id="key" type="password" placeholder="Dashboard API key" size="25">
  <button onclick="loadHealth()">Connect</button>
</div>
<div id="status" class="card">Not connected.</div>
<div id="groups" class="grid"></div>
<script>
const $=id=>document.getElementById(id);
async function api(path, opts={}){
  const base=$("api").value.replace(/\/+$/,"");
  opts.headers={...(opts.headers||{}),Authorization:"Bearer "+$("key").value};
  const r=await fetch(base+path,opts);
  if(!r.ok) throw new Error((await r.text())||r.statusText);
  return r.json();
}
async function loadHealth(){
  try{
    const h=await api("/api/health");
    $("status").textContent="🟢 Ghostea API online • database "+(h.database?"OK":"ERROR");
    const g=await api("/api/groups");
    $("groups").innerHTML="";
    for(const x of g.groups||[]){
      const c=document.createElement("div"); c.className="card";
      c.innerHTML="<h3>Group "+x.chat_id+"</h3><div class='stat'>"+(x.max_warnings??"-")+"</div><small>warning limit</small>";
      $("groups").appendChild(c);
    }
  }catch(e){$("status").textContent="🔴 "+e.message}
}
</script>
</main>
</body>
</html>
